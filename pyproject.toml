[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-intelligence"
version = "0.1.0"
description = "Evidence-grounded pharmaceutical research assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
pharma-intelligence = "pharma_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

